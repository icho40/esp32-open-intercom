<style>
  :root{
    color-scheme: light;
    --bg: #f5f7fa;
    --panel-bg: #ffffff;
    --border: #cfd6e4;
    --fg: #1a1f2a;
    --muted: #6b7280;
  }

  /* ganze Seite füllt Screen, keine Ränder */
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden; /* kein Scrollen */
    display: flex;
    flex-direction: column;
  }

  /* Oberer Block = 80% der Höhe des Bildschirms */
  .topArea {
    position: relative;
    width: 100vw;
    height: 80vh;           /* <- das hier bestimmt die Bildfläche */
    max-height: 80vh;
    background: #eef2f7;
    border-bottom: 2px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Das Bild selbst */
  #thumb {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;    /* ganze Szene sichtbar, kein Beschnitt */
    background: #00000010;
  }

  /* Badge oben links übers Bild */
  .badge{
    position:absolute;
    left:0.75rem;
    top:0.75rem;
    background:rgba(255,255,255,.9);
    border-radius:.6rem;
    border:1px solid var(--border);
    font-size:1rem;
    line-height:1.2;
    font-weight:600;
    color:var(--fg);
    padding:.5rem .7rem;
    min-width:3.2rem;
    text-align:center;
    box-shadow:0 2px 4px rgba(0,0,0,.08);
  }

  /* Unterer Infoblock = restliche ~20% */
  .bottomArea {
    flex: 1 1 auto;
    width: 100vw;
    background: var(--panel-bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align:center;
    padding: 1rem;
    box-sizing: border-box;
  }

  .idleHeadline {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: .5rem;
  }

  .idleSub {
    font-size: 1rem;
    font-weight: 400;
    color: var(--muted);
    max-width: 32rem;
    line-height: 1.4;
  }

</style>

<body>

  <div class="topArea">
    <img id="thumb" src="/idle.jpg" alt="Eingang">
    <div class="badge" id="badgeParty">Partei ?</div>
  </div>

  <div class="bottomArea">
    <div class="idleHeadline" id="idleHeadline">Türstation bereit</div>
    <div class="idleSub" id="idleSub">
      Bitte klingeln. Das Livebild kommt hoffentlich.
    </div>
  </div>

  <script>
  (() => {
  const qs = new URLSearchParams(location.search);
  const party = qs.get("party") || "1";

  async function poll(){
    try{
      const r = await fetch(`/api/status?party=${party}`, {cache:"no-store"});
      if(!r.ok) return;
      const j = await r.json();

      if(j.state !== "idle"){
        location.href = `/p${party}/?call=1`;
      }
    }catch(e){}
  }

  setInterval(poll, 400);
  poll();
})();


  (function(){
    // Partei aus URL lesen: idle.html?party=2
    const qs = new URLSearchParams(location.search);
    const party = qs.get("party") || "?";

    const badge = document.getElementById("badgeParty");
    if (badge) badge.textContent = "Partei " + party;

    const head = document.getElementById("idleHeadline");
    const sub  = document.getElementById("idleSub");
    if (party !== "?") {
      head.textContent = "Wohnung " + party;
      sub.textContent  = "Keiner.";
    }
  })();
  </script>

</body>
